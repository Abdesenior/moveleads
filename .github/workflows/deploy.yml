name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Frontend: build, pre-render, deploy to Cloudflare Workers ──────────
  #      Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
  #      CLOUDFLARE_ACCOUNT_ID. Skips the deploy step until they are set.
  deploy-frontend:
    name: Deploy UI → Cloudflare (moveleads.cloud)
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Install Chromium for pre-rendering
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Build (Vite + pre-render)
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
          VITE_META_MOVER_PIXEL_ID: ${{ vars.VITE_META_MOVER_PIXEL_ID }}

      # Compare page hashes with the live site before it is replaced.
      - name: IndexNow — find changed pages
        if: env.CF_TOKEN != ''
        working-directory: client
        continue-on-error: true
        run: node scripts/indexnow.mjs diff

      - name: Skip deploy — Cloudflare token not configured
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set — deploy manually with 'npx wrangler deploy'."

      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # v3 (the action's default) doesn't support assets-only Workers.
          wranglerVersion: "4.86.0"
          command: deploy

      - name: IndexNow — submit changed pages to Bing
        if: env.CF_TOKEN != ''
        working-directory: client
        continue-on-error: true
        run: node scripts/indexnow.mjs submit

  # ── 2. Backend: Render deploys from GitHub natively; hook is optional ─────
  deploy-backend:
    name: Deploy API → Render
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook (if configured)
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — Render is deploying via native Git integration."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_HOOK" \
            -o /dev/null -w "Render deploy triggered: HTTP %{http_code}\n"

  # ── 3. Smoke test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Wait for deploys to propagate
        run: sleep 45

      - name: API health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.moveleads.cloud/api/health)
          echo "API responded: HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "API health check FAILED" && exit 1)

      - name: Frontend health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://moveleads.cloud/)
          echo "Frontend responded: HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "Frontend health check FAILED" && exit 1)
