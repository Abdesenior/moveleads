# Render Blueprint — https://render.com/docs/blueprint-spec
# Drop this file at the repo root, then go to Render Dashboard → New → Blueprint
# and point it at your GitHub repo. Render will auto-create the service below.

services:
  - type: web
    name: moveleads-api
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true        # redeploy whenever main branch is pushed

    # Scale: Free tier to start. Upgrade to Standard for always-on + more RAM.
    plan: free              # change to 'standard' for production scale

    envVars:
      # ── Server ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000          # Render always injects $PORT; this is just the fallback

      # ── Origins ───────────────────────────────────────────────────────────
      # Comma-separated list of allowed frontend origins for CORS.
      - key: CLIENT_ORIGIN
        value: https://moveleads.cloud,https://www.moveleads.cloud

      # Used by Stripe Checkout success_url / cancel_url redirects.
      - key: CLIENT_URL
        value: https://moveleads.cloud

      # ── Secrets (set manually in Render Dashboard → Environment) ──────────
      - key: MONGODB_URI
        sync: false           # Production Atlas URI — set in Render dashboard

      - key: JWT_SECRET
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # NOTE: STRIPE_PUBLISHABLE_KEY belongs on the CLIENT (Vercel), not here.
      # The client uses VITE_STRIPE_PUBLISHABLE_KEY at build time for embedded checkout.

      - key: TWILIO_ACCOUNT_SID
        sync: false

      - key: TWILIO_AUTH_TOKEN
        sync: false

      - key: TWILIO_PHONE_NUMBER
        sync: false

      # ── Resend (transactional email) ───────────────────────────────────────
      # Domain moveleads.cloud must be verified in Resend dashboard.
      # Emails are sent from no-reply@moveleads.cloud.
      - key: RESEND_API_KEY
        sync: false

      # ── Founder outreach (isolated subdomain) ──────────────────────────────
      # Uses the same Resend API key (Resend supports multiple verified
      # domains per key) but sends from the separate `hello.moveleads.cloud`
      # subdomain so cold-outreach spam complaints can't damage transactional
      # reputation on the root domain. DNS verification in Resend must turn
      # green for ALL four records before sending will succeed.
      - key: OUTREACH_FROM_EMAIL
        value: amin@hello.moveleads.cloud
      - key: OUTREACH_FROM_NAME
        value: Amin from MoveLeads
      - key: OUTREACH_REPLY_TO
        value: amin@hello.moveleads.cloud

      # ── Twilio signature URL ─────────────────────────────────────────────
      # CRITICAL: the inbound voice + SMS webhooks build the URL passed to
      # `validateRequest` from this env. If unset, the fallback resolves to
      # https://moveleads.cloud which never matches the actual POST URL
      # (https://api.moveleads.cloud), so EVERY Twilio signature check 403s.
      - key: SERVER_URL
        value: https://api.moveleads.cloud

      # ── Auction settlement cron secret ───────────────────────────────────
      # POST /api/bids/:leadId/settle is gated by `requireCronSecret`. The
      # cron POSTs with header `x-cron-secret: <this value>`. Generate a
      # long random string in Render dashboard.
      - key: CRON_SECRET
        sync: false

      # ── Cloudflare image generation ──────────────────────────────────────
      # /api/images/generate/:type returns 503 if either is missing.
      - key: CF_API_TOKEN
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false

      # ── Abstract API phone validation ────────────────────────────────────
      # CRITICAL: without this, real lead phone numbers cannot be verified
      # and the lead-ingest path will reject leads as PENDING_MANUAL_REVIEW
      # (production guard). Set in Render dashboard.
      - key: ABSTRACT_API_KEY
        sync: false
